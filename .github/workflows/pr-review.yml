name: PR reviewer

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.pull_request.user.login
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              throw new Error('Only trusted repository contributors may trigger AI review');
            }

  analyze:
    needs: trust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never checkout, install dependencies or execute scripts from the PR head here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch head as data only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "refs/pull/$PR_NUMBER/head"
      - name: Analyze immutable diff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          REVIEW_OUTPUT: ${{ runner.temp }}/review.json
        run: node scripts/pr-review/analyze.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [trust, analyze]
    if: always() && !cancelled() && needs.trust.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch head as data only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "refs/pull/$PR_NUMBER/head"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.analyze.result == 'success'
        with:
          name: review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-result
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-statuses: write
      - name: Publish review for current SHA only
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
          REVIEW_OUTPUT: ${{ runner.temp }}/review-result/review.json
        run: node scripts/pr-review/publish.ts

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ['dev/**', 'v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    name: Ref channel
    runs-on: ubuntu-latest
    steps:
      - name: Classify branch or tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/dev/*) echo 'Channel: development checkpoint' ;;
            refs/tags/v*)
              VERSION="${REF#refs/tags/v}"
              if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                echo 'Invalid SemVer release tag'; exit 1
              fi
              echo 'Channel: versioned release' ;;
            *) echo 'Channel: branch or pull request' ;;
          esac

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn validate

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
